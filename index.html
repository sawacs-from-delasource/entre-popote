<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mes recettes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F7F2;--surface:#FFFFFF;--ink:#1E2820;--muted:#5D6A5F;--line:#DCE2D6;--brand:#2E5B43;--brand-ink:#FFFFFF;--soft:#E4EDE4;--accent:#E3A92B;--danger:#B3412E;color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111712;--surface:#1A221C;--ink:#E8EEE6;--muted:#9AA89C;--line:#2B362E;--brand:#86C7A0;--brand-ink:#0D1912;--soft:#22302A;--accent:#F0C25A;--danger:#E58370;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111712;--surface:#1A221C;--ink:#E8EEE6;--muted:#9AA89C;--line:#2B362E;--brand:#86C7A0;--brand-ink:#0D1912;--soft:#22302A;--accent:#F0C25A;--danger:#E58370;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Open Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3,.display{font-family:"Bricolage Grotesque","Open Sans",system-ui,sans-serif;font-weight:700;letter-spacing:-.01em;line-height:1.1;margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
img{max-width:100%;display:block}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.hidden{display:none!important}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;padding:14px 0}
.brand{font-family:"Bricolage Grotesque",sans-serif;font-size:1.5rem;font-weight:700;color:var(--brand);background:none;border:0;padding:0;white-space:nowrap}
.search{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;white-space:nowrap}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.tags{display:flex;gap:8px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.88rem;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.notice{background:var(--soft);border-radius:10px;padding:10px 14px;margin:16px 0 0;font-size:.92rem}

/* list */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px;padding:24px 0 48px}
.card{background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:10px}
.thumb{aspect-ratio:4/3;border-radius:14px;overflow:hidden;background:var(--soft);position:relative}
.thumb img{width:100%;height:100%;object-fit:cover}
.mono{position:absolute;inset:0;display:grid;place-items:center;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:5.5rem;color:var(--brand);opacity:.85}
.card h3{font-size:1.15rem}
.meta{color:var(--muted);font-size:.88rem}
.empty{padding:72px 0;max-width:520px}
.empty h2{font-size:2.2rem;margin-bottom:10px}
.empty p{color:var(--muted);margin:0 0 20px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* detail */
.hero{display:grid;grid-template-columns:1fr;gap:20px;padding:24px 0}
@media(min-width:820px){.hero{grid-template-columns:1.1fr 1fr;align-items:end}}
.hero .thumb{aspect-ratio:3/2}
.hero h1{font-size:clamp(2rem,5vw,3.4rem);margin-bottom:12px}
.facts{display:flex;gap:22px;flex-wrap:wrap;margin:14px 0}
.fact b{display:block;font-size:1.2rem;font-family:"Bricolage Grotesque",sans-serif}
.fact span{color:var(--muted);font-size:.85rem}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.stepper button{border:0;background:none;width:36px;height:36px;font-size:1.2rem}
.stepper output{min-width:28px;text-align:center;font-weight:700}
.body{display:grid;grid-template-columns:1fr;gap:36px;padding:8px 0 56px;border-top:1px solid var(--line)}
@media(min-width:820px){.body{grid-template-columns:340px 1fr}.ing{position:sticky;top:calc(env(safe-area-inset-top,0px) + 90px);align-self:start}}
.body h2{font-size:1.4rem;margin:24px 0 12px}
.ing ul{list-style:none;margin:0;padding:0}
.ing li{padding:8px 0;border-bottom:1px solid var(--line)}
.ing li.sec{border:0;padding:16px 0 4px;font-weight:700;color:var(--muted);font-size:.9rem}
.ing label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.ing input{margin-top:5px;accent-color:var(--brand);width:18px;height:18px;flex:none}
.ing input:checked+span{text-decoration:line-through;color:var(--muted)}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;max-width:68ch}
.steps li{counter-increment:s;display:grid;grid-template-columns:44px 1fr;gap:8px;padding:12px 0}
.steps li::before{content:counter(s);font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:1.5rem;color:var(--accent)}
.notes{background:var(--soft);border-radius:12px;padding:14px 16px;white-space:pre-wrap;max-width:68ch}
.src{color:var(--brand);word-break:break-all}

/* form */
.form{max-width:760px;padding:24px 0 64px;display:grid;gap:18px}
.form h1{font-size:2rem}
.field{display:grid;gap:6px}
.field label{font-weight:600;font-size:.92rem}
.field small{color:var(--muted)}
.field input,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;width:100%}
.field textarea{min-height:140px;resize:vertical}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.photo-pick{display:flex;gap:14px;align-items:center}
.photo-pick .thumb{width:120px;flex:none}

/* dialog + cook */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:20px}
.dialog{background:var(--surface);border-radius:16px;padding:22px;width:min(640px,100%);max-height:90vh;overflow:auto;display:grid;gap:14px}
.dialog h2{font-size:1.5rem}
.dialog textarea{min-height:220px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);width:100%}
.cook{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 16px) 20px calc(env(safe-area-inset-bottom,0px) + 16px)}
.cook .top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.cook .count{color:var(--muted);font-weight:600}
.cook .step{flex:1;display:flex;align-items:center;justify-content:center;overflow:auto}
.cook .step p{font-size:clamp(1.5rem,4.2vw,2.6rem);line-height:1.35;max-width:30ch;margin:0;font-family:"Bricolage Grotesque",sans-serif;font-weight:500}
.cook{cursor:pointer;user-select:none;-webkit-user-select:none}
.cook .prog{height:4px;background:var(--line);border-radius:4px;margin-bottom:12px;overflow:hidden}
.cook .prog i{display:block;height:100%;width:0;background:var(--brand);transition:width .2s}
.cook .hint{text-align:center;color:var(--muted);font-size:.9rem;margin:8px 0 0}
.cook .first{max-width:640px;width:100%;align-self:flex-start}
.cook .first h2{font-size:clamp(1.8rem,5vw,3rem);margin-bottom:16px}
.cook .first ul{list-style:none;padding:0;margin:0;font-size:1.2rem}
.cook .first li{padding:8px 0;border-bottom:1px solid var(--line)}
.cook .first li.sec{border:0;font-weight:700;color:var(--muted);font-size:1rem;padding-top:16px}
.cook .drawer{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;max-height:35vh;overflow:auto;margin-top:12px}
.cook .drawer ul{margin:0;padding-left:18px}
@media (prefers-reduced-motion:no-preference){.cook .step p{animation:in .25s ease-out}@keyframes in{from{opacity:0;transform:translateY(8px)}}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="bar">
      <button class="brand" id="home">Mes recettes</button>
      <input class="search" id="q" type="search" placeholder="Chercher une recette, un ingrédient…" aria-label="Rechercher">
      <button class="btn primary hidden" id="add">Ajouter</button>
    </div>
    <div class="tags" id="tags"></div>
  </div>
</header>
<main class="wrap" id="main"><p class="meta" style="padding:24px 0">Chargement…</p></main>
<div id="layer"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const main = $("#main"), layer = $("#layer");
let db = null, assets = null, sample = null, canWrite = false, loaded = false;
let recipes = [], activeTag = null, query = "", scale = 1, banner = "";
let draft = null; // prefilled recipe from import

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mins = m => { m = +m || 0; if (!m) return ""; const h = Math.floor(m/60), r = m%60; return h ? (h + " h" + (r ? " " + String(r).padStart(2,"0") : "")) : m + " min"; };
const photo = r => r.photoUrl || (r.photoId ? "/_blob/" + r.photoId : "");
const lines = t => String(t || "").split("\n").map(s => s.trim()).filter(Boolean);

/* quantity scaling */
const UF = {"½":.5,"¼":.25,"¾":.75,"⅓":1/3,"⅔":2/3,"⅛":.125};
function parseQty(s){
  s = s.trim();
  let m = s.match(/^(\d+)\s+(\d+)\/(\d+)$/); if (m) return +m[1] + m[2]/m[3];
  m = s.match(/^(\d+)\s*\/\s*(\d+)$/); if (m) return m[1]/m[2];
  m = s.match(/^(\d*)([½¼¾⅓⅔⅛])$/); if (m) return (+m[1]||0) + UF[m[2]];
  return parseFloat(s.replace(",", "."));
}
function fmtQty(n){
  const w = Math.floor(n), f = n - w;
  const nice = [[.25,"¼"],[.5,"½"],[.75,"¾"],[1/3,"⅓"],[2/3,"⅔"]].find(([v]) => Math.abs(f - v) < .02);
  if (nice && n < 10) return (w || "") + nice[1];
  const r = n >= 10 ? Math.round(n) : Math.round(n*10)/10;
  return String(r).replace(".", ",");
}
function scaleLine(l){
  if (scale === 1) return esc(l);
  return esc(l).replace(/^(\d+\s+\d+\/\d+|\d+\s*\/\s*\d+|\d*[½¼¾⅓⅔⅛]|\d+(?:[.,]\d+)?)/, q => {
    const v = parseQty(q); return isNaN(v) ? q : "<b>" + fmtQty(v*scale) + "</b>";
  });
}

/* routing */
function go(h){ if (location.hash.slice(1) === h) route(); else location.hash = h; }
window.addEventListener("hashchange", route);
function route(){
  const h = location.hash.slice(1);
  $("#add").classList.toggle("hidden", !canWrite);
  if (!loaded) return;
  if (h.startsWith("r-")) { const r = recipes.find(x => x.id === h.slice(2)); return r ? detail(r) : list(); }
  if (h.startsWith("edit-") && canWrite) { const r = recipes.find(x => x.id === h.slice(5)); return r ? form(r) : list(); }
  if (h === "new" && canWrite) return form(draft || {});
  list();
}

/* list */
function renderTags(){
  const all = [...new Set(recipes.flatMap(r => r.tags || []))].sort((a,b)=>a.localeCompare(b,"fr"));
  $("#tags").innerHTML = all.length ? `<button class="chip ${activeTag?"":"on"}" data-tag="">Toutes</button>` + all.map(t => `<button class="chip ${t===activeTag?"on":""}" data-tag="${esc(t)}">${esc(t)}</button>`).join("") : "";
}
$("#tags").addEventListener("click", e => { const b = e.target.closest("[data-tag]"); if (!b) return; activeTag = b.dataset.tag || null; renderTags(); if (location.hash.length > 1) go(""); else list(); });
$("#q").addEventListener("input", e => { query = e.target.value.trim().toLowerCase(); if (location.hash.length > 1) go(""); else list(); });
$("#home").onclick = () => { query = ""; $("#q").value = ""; activeTag = null; renderTags(); go(""); };
$("#add").onclick = () => { draft = null; go("new"); };

function list(){
  window.scrollTo(0,0);
  renderTags();
  const note = banner ? `<p class="notice">${esc(banner)}</p>` : "";
  if (!recipes.length) {
    main.innerHTML = note + `<div class="empty"><h2>Ta boîte à recettes est vide</h2>
      <p>${canWrite ? "Saisis ta première recette, ou colle le texte d’une recette trouvée ailleurs et laisse Claude la mettre en forme." : "Aucune recette partagée pour l’instant."}</p>
      ${canWrite ? `<div class="row"><button class="btn primary" id="e-new">Ajouter une recette</button>${sample ? `<button class="btn" id="e-imp">Importer (texte, captures, Instagram)</button>` : ""}<button class="btn" id="e-mela">Importer depuis Mela</button></div>` : ""}</div>`;
    $("#e-new") && ($("#e-new").onclick = () => { draft = null; go("new"); });
    $("#e-imp") && ($("#e-imp").onclick = importDialog);
    $("#e-mela") && ($("#e-mela").onclick = melaDialog);
    return;
  }
  let rs = recipes.slice().sort((a,b) => (b.updatedAt||0) - (a.updatedAt||0));
  if (activeTag) rs = rs.filter(r => (r.tags||[]).includes(activeTag));
  if (query) rs = rs.filter(r => [r.title, ...(r.tags||[]), ...(r.ingredients||[])].join(" ").toLowerCase().includes(query));
  const imp = canWrite ? `<div class="row" style="padding-top:20px">${sample ? `<button class="btn ghost" id="imp">Importer (texte, captures, Instagram)</button>` : ""}<button class="btn ghost" id="mela">Importer depuis Mela</button></div>` : "";
  main.innerHTML = note + imp + (rs.length ? `<div class="grid">${rs.map(r => `
    <button class="card" data-id="${esc(r.id)}">
      <div class="thumb">${photo(r) ? `<img src="${esc(photo(r))}" alt="" loading="lazy">` : `<span class="mono">${esc((r.title||"?").trim()[0]||"?").toUpperCase()}</span>`}</div>
      <div><h3>${esc(r.title || "Sans titre")}</h3>
      <div class="meta">${[mins((+r.prep||0)+(+r.cook||0)), r.servings ? r.servings + " pers." : "", (r.tags||[]).slice(0,2).join(", ")].filter(Boolean).map(esc).join(", ")}</div></div>
    </button>`).join("")}</div>` : `<p class="meta" style="padding:32px 0">Aucune recette ne correspond.</p>`);
  main.querySelectorAll(".card").forEach(c => c.onclick = () => go("r-" + c.dataset.id));
  $("#imp") && ($("#imp").onclick = importDialog);
  $("#mela") && ($("#mela").onclick = melaDialog);
}

/* detail */
function detail(r){
  window.scrollTo(0,0);
  scale = 1;
  const base = +r.servings || 0;
  const draw = () => {
    const serv = base ? Math.round(base*scale*100)/100 : 0;
    main.innerHTML = `
    <section class="hero">
      <div class="thumb">${photo(r) ? `<img src="${esc(photo(r))}" alt="${esc(r.title)}">` : `<span class="mono">${esc((r.title||"?").trim()[0]||"?").toUpperCase()}</span>`}</div>
      <div>
        <h1>${esc(r.title || "Sans titre")}</h1>
        ${(r.tags||[]).length ? `<div class="row">${r.tags.map(t => `<span class="chip">${esc(t)}</span>`).join("")}</div>` : ""}
        <div class="facts">
          ${r.prep ? `<div class="fact"><b>${mins(r.prep)}</b><span>Préparation</span></div>` : ""}
          ${r.cook ? `<div class="fact"><b>${mins(r.cook)}</b><span>Cuisson</span></div>` : ""}
          ${base ? `<div class="fact"><div class="stepper"><button id="m" aria-label="Moins de personnes">−</button><output>${fmtQty(serv)}</output><button id="p" aria-label="Plus de personnes">+</button></div><span> personnes</span></div>` : ""}
        </div>
        <div class="row">
          ${(r.steps||[]).length ? `<button class="btn primary" id="cookbtn">Lecture</button>` : ""}
          <button class="btn" id="share">Partager</button>
          ${canWrite ? `<button class="btn ghost" id="edit">Modifier</button><button class="btn ghost danger" id="del">Supprimer</button>` : ""}
        </div>
      </div>
    </section>
    <section class="body">
      <div class="ing"><h2>Ingrédients</h2><ul>${(r.ingredients||[]).map((l,i) => l.startsWith("#")
        ? `<li class="sec">${esc(l.replace(/^#+\s*/,""))}</li>`
        : `<li><label><input type="checkbox"><span>${scaleLine(l)}</span></label></li>`).join("")}</ul></div>
      <div>
        <h2>Étapes</h2><ol class="steps">${(r.steps||[]).map(s => `<li><span>${esc(s)}</span></li>`).join("")}</ol>
        ${r.notes ? `<h2>Notes</h2><div class="notes">${esc(r.notes)}</div>` : ""}
        ${r.source ? `<h2>Source</h2>${/^https?:\/\//.test(r.source) ? `<a class="src" href="${esc(r.source)}" target="_blank" rel="noopener">${esc(r.source)}</a>` : `<p>${esc(r.source)}</p>`}` : ""}
      </div>
    </section>`;
    const step = d => { const n = Math.max(1, Math.round(base*scale) + d); scale = n/base; draw(); };
    $("#m") && ($("#m").onclick = () => step(-1));
    $("#p") && ($("#p").onclick = () => step(1));
    $("#cookbtn") && ($("#cookbtn").onclick = () => cook(r));
    $("#share").onclick = () => share(r);
    $("#edit") && ($("#edit").onclick = () => go("edit-" + r.id));
    const del = $("#del");
    if (del) del.onclick = async () => {
      if (!del.classList.contains("armed")) { del.classList.add("armed"); del.textContent = "Confirmer la suppression"; setTimeout(() => { if (del.isConnected) { del.classList.remove("armed"); del.textContent = "Supprimer"; } }, 4000); return; }
      del.disabled = true;
      try { await db.doc("recipes/" + r.id).delete(); go(""); } catch(e) { del.disabled = false; alertMsg("Suppression impossible : " + (e.message || e.code)); }
    };
  };
  draw();
}

function asText(r){
  return [r.title, r.servings ? `Pour ${r.servings} personnes` : "", "",
    "Ingrédients", ...(r.ingredients||[]).map(l => l.startsWith("#") ? "\n" + l.replace(/^#+\s*/,"") : "- " + l), "",
    "Étapes", ...(r.steps||[]).map((s,i) => `${i+1}. ${s}`),
    r.notes ? "\nNotes\n" + r.notes : "", r.source ? "\nSource : " + r.source : ""].join("\n").replace(/\n{3,}/g,"\n\n").trim();
}
async function share(r){
  const text = asText(r);
  try { if (navigator.share) { await navigator.share({ title: r.title, text }); return; } } catch(e) { if (e.name === "AbortError") return; }
  try { await navigator.clipboard.writeText(text); alertMsg("Recette copiée, tu peux la coller où tu veux."); return; } catch(e) {}
  modal(`<h2>Partager</h2><p class="meta">Copie le texte ci-dessous.</p><textarea readonly>${esc(text)}</textarea><div class="row"><button class="btn primary" data-close>Fermer</button></div>`);
}

/* reading mode */
let wake = null;
function cook(r){
  const steps = r.steps || [], ings = r.ingredients || [];
  const total = steps.length + 1;
  let i = 0, showIng = false, tx = null, ty = null;
  try { navigator.wakeLock?.request("screen").then(w => wake = w).catch(()=>{}); } catch(e) {}
  layer.innerHTML = `<div class="cook" role="dialog" aria-label="Lecture"><div class="prog"><i></i></div>
    <div class="top"><span class="count"></span><div class="row"><button class="btn ghost" id="ci">Ingrédients</button><button class="btn ghost" id="cx">Quitter</button></div></div>
    <div class="drawer hidden" id="cdr"></div>
    <div class="step" id="cs"></div>
    <p class="hint">Touche l’écran à droite pour avancer, à gauche pour revenir</p></div>`;
  const el = layer.querySelector(".cook");
  try { el.requestFullscreen?.().catch(()=>{}); } catch(e) {}
  const close = () => {
    document.removeEventListener("keydown", key);
    try { if (document.fullscreenElement) document.exitFullscreen(); } catch(e) {}
    try { wake?.release(); } catch(e) {} wake = null; layer.innerHTML = "";
  };
  const draw = () => {
    $("#cs").innerHTML = i === 0
      ? `<div class="first"><h2>${esc(r.title)}</h2><ul>${ings.map(l => l.startsWith("#") ? `<li class="sec">${esc(l.replace(/^#+\s*/,""))}</li>` : `<li>${scaleLine(l)}</li>`).join("")}</ul></div>`
      : `<p>${esc(steps[i-1])}</p>`;
    el.querySelector(".count").textContent = i === 0 ? "Ingrédients" : i === steps.length ? `Dernière étape (${i}/${steps.length})` : `Étape ${i} sur ${steps.length}`;
    el.querySelector(".prog i").style.width = (i / Math.max(1, total - 1) * 100) + "%";
    $("#ci").classList.toggle("hidden", i === 0);
    el.querySelector(".hint").classList.toggle("hidden", i !== 0);
    $("#cs").scrollTop = 0;
  };
  const nav = d => { const n = i + d; if (n >= total) return close(); i = Math.max(0, n); draw(); };
  const key = e => { if (["ArrowRight"," ","Enter"].includes(e.key)) { e.preventDefault(); nav(1); } if (e.key === "ArrowLeft") nav(-1); if (e.key === "Escape") close(); };
  document.addEventListener("keydown", key);
  $("#cx").onclick = close;
  $("#ci").onclick = () => {
    showIng = !showIng; const d = $("#cdr"); d.classList.toggle("hidden", !showIng);
    d.innerHTML = `<ul>${ings.filter(l => !l.startsWith("#")).map(l => `<li>${scaleLine(l)}</li>`).join("")}</ul>`;
    $("#ci").textContent = showIng ? "Masquer" : "Ingrédients";
  };
  el.addEventListener("pointerdown", e => { tx = e.clientX; ty = e.clientY; });
  el.addEventListener("pointerup", e => {
    if (tx === null || e.target.closest("button, .drawer")) { tx = null; return; }
    const dx = e.clientX - tx, dy = e.clientY - ty; tx = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) return nav(dx < 0 ? 1 : -1);
    if (Math.abs(dy) > 10) return;
    nav(e.clientX < el.clientWidth / 3 ? -1 : 1);
  });
  draw();
}

      <div class="row"><label class="btn" for="pf">Choisir une photo</label><input id="pf" type="file" accept="image/*" class="hidden">${ph.url ? `<button type="button" class="btn ghost" id="prm">Retirer</button>` : ""}</div></div><small id="pst"></small></div>` : ""}

    <div class="field"><label for="ig">Ingrédients</label><textarea id="ig" placeholder="200 g de farine&#10;3 œufs&#10;# Pour la sauce&#10;20 cl de crème">${esc((r.ingredients||[]).join("\n"))}</textarea><small>Un par ligne, la quantité en premier pour pouvoir ajuster les portions. Une ligne qui commence par # devient un sous-titre.</small></div>

  </form>`;
  $("#cancel").onclick = () => { draft = null; history.length > 1 ? history.back() : go(""); };
  const pf = $("#pf");

    const file = pf.files[0]; if (!file) return;
    $("#pst").textContent = "Envoi de la photo…"; $("#sv-btn").disabled = true;
    try {
      const blob = await shrink(file);
      const res = await assets.upload(blob);
      ph = { id: res.id, url: res.url };
      $("#pv").innerHTML = `<img src="${esc(res.url)}" alt="">`; $("#pst").textContent = "";
    } catch(e) { $("#pst").textContent = "Envoi impossible : " + (e.message || e.code || "erreur"); }
    $("#sv-btn").disabled = false;
  };
  $("#prm") && ($("#prm").onclick = () => { ph = { id: "", url: "" }; $("#pv").innerHTML = ""; $("#prm").remove(); });
  $("#f").onsubmit = async e => {
    e.preventDefault();
    const title = $("#t").value.trim();
    if (!title) { $("#t").focus(); return; }

      title, servings: +$("#sv").value || 0, prep: +$("#pr").value || 0, cook: +$("#ck").value || 0,
      tags: $("#tg").value.split(",").map(s => s.trim()).filter(Boolean),

    };
    const btn = $("#sv-btn"); btn.disabled = true; btn.textContent = "Enregistrement…";
    try {
      let id = r.id;
      if (isNew) { const ref = await db.collection("recipes").add(data); id = ref.id; }
      else await db.doc("recipes/" + id).set(data);

    } catch(err) { btn.disabled = false; btn.textContent = "Enregistrer"; alertMsg("Enregistrement impossible : " + (err.message || err.code)); }

function shrink(file, max = 1600){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error("conversion")), "image/jpeg", .85);
    };
    img.onerror = () => rej(new Error("image illisible"));
    img.src = url;
  });
}

/* import from Mela */
function loadZip(){
  return window.JSZip ? Promise.resolve(window.JSZip) : new Promise((res, rej) => {
    const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";
    s.onload = () => res(window.JSZip); s.onerror = () => rej(new Error("chargement du lecteur de fichiers")); document.head.appendChild(s);
  });
}
function melaTime(t){
  t = String(t || "").toLowerCase().trim(); if (!t) return 0;
  const iso = t.match(/^pt(?:(\d+)h)?(?:(\d+)m)?/); if (iso && (iso[1] || iso[2])) return (+iso[1]||0)*60 + (+iso[2]||0);
  const hm = t.match(/(\d+)\s*h\w*\s*(\d+)?/), m = t.match(/(\d+)\s*m/);
  if (hm) return +hm[1]*60 + (+hm[2] || 0);
  if (m) return +m[1];
  const n = parseInt(t); return isNaN(n) ? 0 : n;
}
function melaToRecipe(j){
  return {
    title: j.title || "Sans titre", servings: parseInt(j.yield) || 0, prep: melaTime(j.prepTime), cook: melaTime(j.cookTime),
    tags: Array.isArray(j.categories) ? j.categories.map(String) : [],
    ingredients: lines(j.ingredients),
    steps: lines(j.instructions).map(s => s.replace(/^\d+[.)]\s*/, "")).filter(Boolean),
    notes: [j.text, j.notes].filter(Boolean).join("\n\n").trim(), source: j.link || "",
    photoId: "", photoUrl: "", updatedAt: Date.now(), createdAt: Date.now()
  };
}
function melaDialog(){
  modal(`<h2>Importer depuis Mela</h2>
    <p class="meta">Dans Mela, sélectionne tes recettes (ou toutes), puis Partager et Exporter. Choisis ici le fichier .melarecipes obtenu. Les recettes déjà importées sont ignorées.</p>
    <div class="row"><label class="btn primary" for="mf">Choisir le fichier</label><input id="mf" type="file" class="hidden"><button class="btn ghost" data-close>Fermer</button></div>
    <p class="meta" id="mst"></p>`);
  $("#mf").onchange = async () => {
    const f = $("#mf").files[0]; if (!f) return;
    const st = $("#mst"); st.textContent = "Lecture du fichier…";
    try {
      const buf = new Uint8Array(await f.arrayBuffer());
      let items = [];
      if (buf[0] === 0x50 && buf[1] === 0x4B) {
        const zip = await (await loadZip()).loadAsync(buf);
        const names = Object.keys(zip.files).filter(n => !zip.files[n].dir && /\.(melarecipe|json)$/i.test(n));
        for (const n of names) { try { items.push(JSON.parse(await zip.files[n].async("string"))); } catch(e) {} }
      } else {
        const j = JSON.parse(new TextDecoder().decode(buf)); items = Array.isArray(j) ? j : [j];
      }
      items = items.filter(j => j && (j.title || j.ingredients));
      if (!items.length) throw new Error("aucune recette trouvée dans ce fichier");
      let done = 0, skipped = 0, failed = 0;
      for (const j of items) {
        const clean = s => String(s || "").replace(/[^A-Za-z0-9_-]/g, "").slice(0, 120);
        const id = "mela-" + (clean(j.id) || clean(j.title) || Date.now());
        if (recipes.some(r => r.id === id)) { skipped++; continue; }
        try {
          const r = melaToRecipe(j);
          if (assets && Array.isArray(j.images) && j.images[0]) {
            try {
              const raw = Uint8Array.from(atob(j.images[0]), c => c.charCodeAt(0));
              const up = await assets.upload(await shrink(new Blob([raw], { type: "image/jpeg" })));
              r.photoId = up.id; r.photoUrl = up.url;
            } catch(e) {}
          }
          await db.doc("recipes/" + id).set(r); done++;
        } catch(e) { failed++; }
        st.textContent = `${done + skipped + failed} sur ${items.length}…`;
      }
      st.textContent = `Terminé : ${done} recette(s) importée(s)` + (skipped ? `, ${skipped} déjà présente(s)` : "") + (failed ? `, ${failed} en échec` : "") + ".";
    } catch(e) { st.textContent = "Import impossible : " + (e.message || e.code || "fichier non reconnu"); }
  };
}

function modal(html){
  layer.innerHTML = `<div class="overlay"><div class="dialog" role="dialog">${html}</div></div>`;
  layer.querySelector(".overlay").addEventListener("click", e => { if (e.target.classList.contains("overlay") || e.target.hasAttribute("data-close")) layer.innerHTML = ""; });
}
function alertMsg(t){ modal(`<p>${esc(t)}</p><div class="row"><button class="btn primary" data-close>OK</button></div>`); }

/* boot */
(async () => {
  const fallback = setTimeout(() => { if (!loaded) { banner = "Cette page doit être ouverte depuis Claude pour charger les recettes."; loaded = true; route(); } }, 12000);
  try {
    if (!window.claude?.use) throw 0;
    db = await claude.use("db");
    if (!db) { clearTimeout(fallback); banner = "Connecte-toi à Claude pour voir les recettes."; loaded = true; return route(); }
    const user = await claude.use("user");
    const can = user ? await user.can("data.write") : null;
    canWrite = can !== false;
    if (canWrite) { assets = await claude.use("assets"); sample = await claude.use("sample"); }
    db.collection("recipes").onSnapshot(snap => {
      clearTimeout(fallback);
      recipes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      const h = location.hash.slice(1);
      if (!loaded || !(h === "new" || h.startsWith("edit-"))) { loaded = true; route(); }
      else renderTags();
    }, err => { clearTimeout(fallback); banner = "Lecture des recettes impossible (" + err.code + ")."; loaded = true; route(); });
  } catch(e) { clearTimeout(fallback); banner = "Cette page doit être ouverte depuis Claude pour charger les recettes."; loaded = true; route(); }
})();
})();
